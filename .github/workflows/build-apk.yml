name: Build CricketScore Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile --config.minimum-release-age=0

      - name: Build web app
        run: pnpm --config.minimum-release-age=0 run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CricketScore-Pro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricketScore-Pro-APK
          path: CricketScore-Pro.apk
        
