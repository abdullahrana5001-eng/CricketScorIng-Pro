name: Build CricketScore Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build web app
        run: npm run build

      - name: Check and add Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding platform..."
            npx cap add android
          else
            echo "Android directory already exists. Skipping add."
          fi

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -la android/app/build/outputs/apk/debug/

      - name: Copy and rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/CricketScore-Pro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricketScore-Pro-APK
          path: artifacts/CricketScore-Pro.apk
          retention-days: 30
